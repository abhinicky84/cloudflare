<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NFL Signup</title>
    <style>
        :root {
            --nfl-blue: #013369;
            --nfl-red: #d50a0a;
            --border: #d9dee7;
            --text: #172033;
            --muted: #596579;
            --header-height: 68px;
            --footer-height: 54px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: grid;
            grid-template-rows: var(--header-height) minmax(0, 1fr) var(--footer-height);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
        }

        .site-header,
        .site-footer {
            display: flex;
            align-items: center;
            padding: 0 28px;
            background: #ffffff;
        }

        .site-header {
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            color: var(--nfl-blue);
            font-size: 18px;
            font-weight: 700;
            line-height: 1;
            text-decoration: none;
        }

        .brand img {
            width: 42px;
            height: 42px;
            object-fit: contain;
            display: block;
        }

        .header-links,
        .footer-links {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        a {
            color: var(--nfl-blue);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            color: var(--nfl-red);
            text-decoration: underline;
        }

        main {
            min-height: 0;
            background: #f5f7fb;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: #ffffff;
        }

        .site-footer {
            justify-content: center;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 13px;
        }

        .site-footer span {
            margin-right: 20px;
            white-space: nowrap;
        }

        @media (max-width: 640px) {
            :root {
                --header-height: 62px;
                --footer-height: 78px;
            }

            .site-header,
            .site-footer {
                padding: 0 16px;
            }

            .brand span {
                display: none;
            }

            .header-links {
                gap: 12px;
            }

            .site-footer {
                flex-wrap: wrap;
                gap: 8px 14px;
            }

            .site-footer span {
                width: 100%;
                margin: 0;
                text-align: center;
            }

            .footer-links {
                gap: 14px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="#" aria-label="NFL home">
            <img src="blob:https://c8bff057-b1ec-43ce-99d7-d8315b309264-v3-figmaiframepreview.figma.site/6dd05bdc-6259-4a07-8d47-f0dfd79cbc10#filename=81d5d496dd30d6677cedc87d436e29f9b7435265.png" alt="NFL logo">
            <span>NFL</span>
        </a>
        <nav class="header-links" aria-label="Primary">
            <a href="#">Events</a>
            <a href="#">Support</a>
        </nav>
    </header>

    <main>
        <iframe
            title="NFL signup form"
            src="https://stage-fanexperience.nfl.com/content/forms/af/national-football-league/phi/br/en/event-rsvp/signup.html"
            loading="eager">
        </iframe>
    </main>

    <footer class="site-footer">
        <span>&copy; 2026 National Football League</span>
        <nav class="footer-links" aria-label="Footer">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Use</a>
            <a href="#">Contact</a>
        </nav>
    </footer>
</body>
</html>
